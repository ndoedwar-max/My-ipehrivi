name: Auto Update M3U Key

on:
  schedule:
    # Menggunakan format Cron. Contoh di bawah ini berjalan setiap 3 jam.
    # Anda bisa mengubahnya sesuai kebutuhan.
    - cron: '0 */3 * * *'
  workflow_dispatch: # Membantu Anda menjalankan script secara manual kapan saja

jobs:
  update-key:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.x'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Script Python
      run: python update_m3u.py

    - name: Commit and Push if Changes Exist
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update M3U key" && git push)
